          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /folders/:
    get:
      operationId: folders_list
      description: Return a paginated list of the authenticated user's folders.
      summary: List all folders
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - folders
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFolderList'
          description: A paginated list of folders.
    post:
      operationId: folders_create
      description: Create a new folder. Authentication is required. The authenticated
        user will be set as the owner of the folder.
      summary: Create a folder
      tags:
      - folders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Folder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Folder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Folder'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: The folder was successfully created.
        '400':
          description: The request data was invalid, or a folder with this name already
            exists for this user.
  /folders/{id}/:
    get:
      operationId: folders_retrieve
      description: Return the details of a single folder.
      summary: Retrieve a folder
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this folder.
        required: true
      tags:
      - folders
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: The requested folder.
        '404':
          description: The requested folder does not exist.
    put:
      operationId: folders_update
      description: Replace all writable fields of an existing folder. Only the folder
        owner can update the folder.
      summary: Update a folder
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this folder.
        required: true
      tags:
      - folders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Folder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Folder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Folder'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: The folder was successfully updated.
        '400':
          description: The request data was invalid, or a folder with this name already
            exists for this user.
        '403':
          description: The authenticated user is not the folder owner.
        '404':
          description: The requested folder does not exist.
    patch:
      operationId: folders_partial_update
      description: Update one or more fields of an existing folder. Only the folder
        owner can update the folder.
      summary: Partially update a folder
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this folder.
        required: true
      tags:
      - folders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFolder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFolder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFolder'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: The folder was successfully updated.
        '400':
          description: The request data was invalid, or a folder with this name already
            exists for this user.
        '403':
          description: The authenticated user is not the folder owner.
        '404':
          description: The requested folder does not exist.
    delete:
      operationId: folders_destroy
      description: Delete a folder. Only the folder owner can delete it. Tasks in
        the folder are not deleted — they become uncategorised.
      summary: Delete a folder
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this folder.
        required: true
      tags:
      - folders
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The folder was successfully deleted.
        '403':
          description: The authenticated user is not the folder owner.
        '404':
          description: The requested folder does not exist.
  /tasks/:
    get:
      operationId: tasks_list
      description: Return a paginated list of all tasks.
      summary: List all tasks
      parameters:
      - in: query
        name: completed
        schema:
          type: boolean
      - in: query
        name: folder
        schema:
          type: string
      - in: query
        name: important
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - tasks
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: A paginated list of tasks.
    post:
      operationId: tasks_create
      description: Create a new task. Authentication is required. The authenticated
        user will be set as the owner of the task.
      summary: Create a task
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              CreateTask:
                value:
                  title: Learn API documentation
                  completed: false
                  important: true
                summary: Create task
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                CreatedTask:
                  value:
                    id: 0
                    title: Learn API documentation
                    completed: false
                    important: true
                    created_at: '2026-09-02T00:15:07.857Z'
                    updated_at: '2026-09-02T00:15:07.857Z'
                    owner: john
                  summary: Created task
          description: The task was successfully created.
        '400':
          description: The request data was invalid.
  /tasks/{id}/:
    get:
      operationId: tasks_retrieve
      description: Return the details of a single task.
      summary: Retrieve a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: The requested task.
        '404':
          description: The requested task does not exist.
    put:
      operationId: tasks_update
      description: Replace all writable fields of an existing task. Only the task
        owner can update the task.
      summary: Update a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: The task was successfully updated.
        '400':
          description: The request data is invalid.
        '403':
          description: The authenticated user is not the task owner.
        '404':
          description: The requested task does not exist.
    patch:
      operationId: tasks_partial_update
      description: Update one or more fields of an existing task. Only the task owner
        can update the task.
      summary: Partially update a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: The task was successfully updated.
        '400':
          description: The request data is invalid.
        '403':
          description: The authenticated user is not the task owner.
        '404':
          description: The requested task does not exist.
    delete:
      operationId: tasks_destroy
      description: Delete a task. Only the task owner can delete it.
      summary: Delete a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The task was successfully deleted.
        '403':
          description: The authenticated user is not the task owner.
        '404':
          description: The requested task does not exist.
  /users/:
    get:
      operationId: users_list
      description: Return a paginated list of users.
      summary: List all users
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: A paginated list of users.
    post:
      operationId: users_create
      description: Create a new user. Only a superuser can create a user.
      summary: Create a user
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The user was successfully created.
        '400':
          description: The request data is invalid.
        '403':
          description: The authenticated user is not a superuser.
  /users/{id}/:
    get:
      operationId: users_retrieve
      description: Return details of a single user and their tasks.
      summary: Retrieve a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The requested user and their tasks.
        '404':
          description: User not found.
    put:
      operationId: users_update
      description: Update a user. Only a superuser can update a user.
      summary: Update a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The user was successfully updated.
        '400':
          description: The request data is invalid.
        '403':
          description: The authenticated user is not a superuser.
        '404':
          description: The requested user does not exist.
    patch:
      operationId: users_partial_update
      description: Partially update a user. Only a superuser can update a user.
      summary: Partially update a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The user was successfully updated.
        '400':
