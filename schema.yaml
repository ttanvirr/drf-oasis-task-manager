    delete:
      operationId: users_destroy
      description: Delete a user. Only a superuser can delete a user.
      summary: Delete a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The user was successfully deleted.
        '403':
          description: The authenticated user is not a superuser.
        '404':
          description: The requested user does not exist.
  /users/me/:
    get:
      operationId: users_me_retrieve
      description: Retrieve or update the currently authenticated user's profile.
      summary: Retrieve or update the current user
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The current user's profile.
        '400':
          description: The request data was invalid.
    put:
      operationId: users_me_update
      description: Retrieve or update the currently authenticated user's profile.
      summary: Retrieve or update the current user
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The current user's profile.
        '400':
          description: The request data was invalid.
    patch:
      operationId: users_me_partial_update
      description: Retrieve or update the currently authenticated user's profile.
      summary: Retrieve or update the current user
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
